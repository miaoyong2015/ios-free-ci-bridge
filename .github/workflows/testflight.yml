name: Encrypted iOS unsigned build

on:
  workflow_dispatch:

concurrency:
  group: mememash-unsigned-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt source
        env:
          PAYLOAD_PASSWORD: ${{ secrets.PAYLOAD_PASSWORD }}
        run: |
          mkdir source
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in payload.tar.gz.enc \
            -out "$RUNNER_TEMP/source.tar.gz" \
            -pass env:PAYLOAD_PASSWORD
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C source

      - name: Test studio recipes and gesture stages
        working-directory: source
        run: |
          swiftc MemeMash/Models/StudioDocument.swift Tests/StudioDocumentTests.swift \
            -o "$RUNNER_TEMP/studio-tests"
          "$RUNNER_TEMP/studio-tests"

      - name: Compile unsigned iPhone app
        working-directory: source
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 12))
          xcodebuild build \
            -project MemeMash.xcodeproj \
            -scheme MemeMash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=VUPS57Y23P \
            PRODUCT_BUNDLE_IDENTIFIER=com.miaoyong.MemeMash \
            MARKETING_VERSION=1.2 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          test -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MemeMash.app"

      - name: Encrypt unsigned app
        env:
          PAYLOAD_PASSWORD: ${{ secrets.PAYLOAD_PASSWORD }}
        run: |
          tar -czf "$RUNNER_TEMP/unsigned-app.tar.gz" \
            -C "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" MemeMash.app
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/unsigned-app.tar.gz" \
            -out unsigned-app.tar.gz.enc \
            -pass env:PAYLOAD_PASSWORD

      - name: Store encrypted unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: mememash-unsigned-${{ github.run_number }}
          path: unsigned-app.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove decrypted material
        if: always()
        run: |
          rm -rf source "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/DerivedData"
          rm -f "$RUNNER_TEMP/unsigned-app.tar.gz" unsigned-app.tar.gz.enc
