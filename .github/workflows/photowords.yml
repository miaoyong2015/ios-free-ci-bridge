name: PhotoWords encrypted build

# 私有仓库 Actions 额度不可用，借公开仓库的免费 macOS runner 构建。
# 源码、日志、截图全部 AES 加密，公开日志里只打印成败行。
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: photowords-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      PW: ${{ secrets.PHOTOWORDS_PAYLOAD_PASSWORD }}
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Fetch and decrypt source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT" src
          gh release download photowords-payload -R "$GITHUB_REPOSITORY" -p photowords.tar.gz.enc -D "$RUNNER_TEMP"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/photowords.tar.gz.enc" -out "$RUNNER_TEMP/src.tar.gz" -pass env:PW
          tar -xzf "$RUNNER_TEMP/src.tar.gz" -C src
          rm "$RUNNER_TEMP/src.tar.gz"
          echo "source ok"
          xcodebuild -version | tee "$OUT/xcode-version.txt"

      - name: Generate project
        working-directory: src
        run: |
          brew install xcodegen >/dev/null 2>&1 || true
          xcodegen generate > "$OUT/xcodegen.log" 2>&1 && echo "xcodegen ok"

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devs = [d for v in data['devices'].values() for d in v if d['isAvailable'] and d['name'].startswith('iPhone')]
          pro = [d for d in devs if d['name'].endswith('Pro')]
          print((pro or devs)[-1]['udid'] if devs else '')")
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        working-directory: src
        run: |
          set +e
          xcodebuild test -project PhotoWords.xcodeproj -scheme PhotoWords \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > "$OUT/test.log" 2>&1
          code=$?
          grep -E "Executed [0-9]+ tests" "$OUT/test.log" | tail -1 | sed -E 's/.*(Executed [0-9]+ tests, with [0-9]+ failures).*/\1/'
          echo "test exit $code"
          echo "$code" > "$OUT/test.exit"

      - name: Screenshots
        working-directory: src
        run: |
          set +e
          [ "$(cat $OUT/test.exit)" = "0" ] || exit 0
          UDID=${{ steps.sim.outputs.udid }}
          B=com.lobster.photowords
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/PhotoWords.app" -maxdepth 6 | head -1)
          [ -n "$APP" ] || { echo "no app"; exit 0; }
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b > /dev/null
          xcrun simctl install $UDID "$APP"
          xcrun simctl status_bar $UDID override --time "9:41" --batteryState charged --batteryLevel 100 || true
          mkdir -p "$OUT/shots"
          shot() {
            local name=$1 wait=$2; shift 2
            xcrun simctl terminate $UDID $B 2>/dev/null || true
            xcrun simctl launch $UDID $B "$@" > /dev/null
            sleep $wait
            xcrun simctl io $UDID screenshot "$OUT/shots/$name.png" > /dev/null 2>&1
          }
          shot 01-onboarding 6
          shot 02-home-empty 6 -SkipOnboarding
          shot 03-paywall 6 -SkipOnboarding -ShowPaywall
          shot 04-review 6 -SkipOnboarding -DemoTab review
          shot 05-profile 6 -SkipOnboarding -DemoTab profile
          shot 06-en-onboarding 6 -AppleLanguages "(en)" -AppleLocale en_US
          shot 07-en-paywall 6 -AppleLanguages "(en)" -AppleLocale en_US -SkipOnboarding -ShowPaywall
          ls "$OUT/shots" | wc -l | xargs echo "screenshots:"

      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: src
        env:
          KEY_B64: ${{ secrets.PHOTOWORDS_ASC_KEY_B64 }}
          KEY_ID: ${{ secrets.PHOTOWORDS_ASC_KEY_ID }}
          ISSUER: ${{ secrets.PHOTOWORDS_ASC_ISSUER_ID }}
        run: |
          set +e
          test "$(cat $OUT/test.exit)" = "0" || { echo "tests failed, not uploading"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          BUILD=$((GITHUB_RUN_NUMBER + 200))
          echo "build number $BUILD" | tee "$OUT/build-number.txt"
          # 无签名归档：自动签名会在每台新 runner 上新建开发证书（账号已到上限），发布签名在导出时用云端证书完成
          xcodebuild archive -project PhotoWords.xcodeproj -scheme PhotoWords -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PhotoWords.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > "$OUT/archive.log" 2>&1
          code=$?
          echo "archive exit $code"
          if [ $code -eq 0 ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>VUPS57Y23P</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PhotoWords.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > "$OUT/export.log" 2>&1
            code=$?
            echo "export/upload exit $code"
          fi
          rm -rf ~/private_keys
          echo "$code" > "$OUT/upload.exit"
          exit $code

      - name: Encrypt results
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/out.tar.gz" -C "$OUT" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/out.tar.gz" -out photowords-results.tar.gz.enc -pass env:PW

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photowords-results
          path: photowords-results.tar.gz.enc
          retention-days: 3
          compression-level: 0

      - name: Fail if tests failed
        run: test "$(cat $OUT/test.exit)" = "0"
