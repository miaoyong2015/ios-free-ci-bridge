name: TapCourt encrypted build

# Source, logs and screenshots are AES-encrypted; only pass/fail lines are printed.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false
      shots:
        description: "Take App Store screenshots"
        type: boolean
        default: true
      tests:
        description: "Run iPhone + Watch UI tests and StoreKit tests"
        type: boolean
        default: false

concurrency:
  group: tapcourt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PW: ${{ secrets.SLIME_PAYLOAD_PASSWORD }}
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Fetch and decrypt source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT" src
          gh release download tapcourt-payload -R "$GITHUB_REPOSITORY" -p payload.tar.gz.enc -D "$RUNNER_TEMP"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/payload.tar.gz.enc" -out "$RUNNER_TEMP/src.tar.gz" -pass env:PW
          tar -xzf "$RUNNER_TEMP/src.tar.gz" -C src
          echo "source ok"

      - name: Generate project and test engine
        working-directory: src
        run: |
          brew install xcodegen >/dev/null 2>&1
          xcodegen generate > "$OUT/xcodegen.log" 2>&1 && echo "xcodegen ok"
          xcodebuild -version > "$OUT/xcode-version.txt"
          set +e
          tools/test_engine.sh > "$OUT/engine.log" 2>&1
          code=$?
          tail -1 "$OUT/engine.log"
          echo "engine exit $code"
          echo "$code" > "$OUT/test.exit"

      - name: UI tests (iPhone, StoreKit, Watch, sync)
        if: ${{ inputs.tests }}
        working-directory: src
        run: |
          set +e
          read PAIR IPHONE WATCH SKPHONE <<< $(xcrun simctl list --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          pairs = [(k, p['phone'], p['watch']) for k, p in d['pairs'].items() if p['phone']['state'] != 'Unavailable']
          best = [x for x in pairs if 'Pro Max' in x[1]['name']] or pairs
          pid, ph, w = best[-1]
          paired = {p['phone']['udid'] for p in d['pairs'].values()}
          phones = [x for v in d['devices'].values() for x in v if x['isAvailable'] and x['name'].startswith('iPhone') and x['udid'] not in paired]
          print(pid, ph['udid'], w['udid'], phones[-1]['udid'] if phones else ph['udid'])")
          echo "pair phone $IPHONE watch $WATCH storekit-phone $SKPHONE"
          for d in $IPHONE $WATCH $SKPHONE; do xcrun simctl boot $d 2>/dev/null; done
          for d in $IPHONE $WATCH $SKPHONE; do xcrun simctl bootstatus $d -b > /dev/null; done
          xcrun simctl pair_activate $PAIR 2>&1 | tail -1
          summary() { xcrun xcresulttool get test-results summary --path "$1" --compact 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('$2', 'result', d.get('result'), 'passed', d.get('passedTests'), 'failed', d.get('failedTests'), 'skipped', d.get('skippedTests'))
          for f in d.get('testFailures', []): print('  FAIL', f.get('testName'), '-', (f.get('failureText') or '')[:240])"; }
          DD="$RUNNER_TEMP/tdd"
          xcodebuild build-for-testing -project TapCourt.xcodeproj -scheme TapCourt -destination "id=$IPHONE" -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO > "$OUT/build-tests.log" 2>&1
          echo "build-for-testing phone exit $?"
          xcodebuild build-for-testing -project TapCourt.xcodeproj -scheme TapCourtWatch -destination "id=$WATCH" -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO >> "$OUT/build-tests.log" 2>&1
          echo "build-for-testing watch exit $?"
          # Warm up the watch simulator: first app launch on a cold watch can exceed XCUITest's launch timeout.
          xcrun simctl install $WATCH "$DD/Build/Products/Debug-watchsimulator/TapCourtWatch.app"
          xcrun simctl launch $WATCH com.lobster.smashly.watchkitapp > /dev/null; sleep 25
          xcrun simctl terminate $WATCH com.lobster.smashly.watchkitapp
          run() {  # name scheme device extra...
            local name=$1 scheme=$2 dev=$3; shift 3
            xcodebuild test-without-building -project TapCourt.xcodeproj -scheme $scheme -destination "id=$dev" \
              -derivedDataPath "$DD" -resultBundlePath "$OUT/$name.xcresult" "$@" > "$OUT/test-$name.log" 2>&1
            echo "$name tests exit $?"; summary "$OUT/$name.xcresult" $name
          }
          run storekit TapCourt $SKPHONE -only-testing:TapCourtTests
          run phone TapCourt $IPHONE -only-testing:TapCourtUITests
          run watch TapCourtWatch $WATCH
          export TEST_RUNNER_TC_EXPECT_WATCH=1
          run sync TapCourt $IPHONE -only-testing:TapCourtUITests/TapCourtUITests/testWatchMatchesSyncToPhone
          exit 0

      - name: Simulator build and screenshots
        if: ${{ inputs.shots }}
        working-directory: src
        run: |
          set +e
          read IPHONE WATCH <<< $(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          devs = [x for v in d['devices'].values() for x in v if x['isAvailable']]
          ph = [x for x in devs if x['name'].startswith('iPhone') and 'Pro Max' in x['name']] or [x for x in devs if x['name'].startswith('iPhone')]
          w = [x for x in devs if x['name'].startswith('Apple Watch') and '46mm' in x['name']] or [x for x in devs if x['name'].startswith('Apple Watch')]
          print(ph[-1]['udid'], w[-1]['udid'] if w else 'none')")
          echo "iphone $IPHONE watch $WATCH"
          xcodebuild build -project TapCourt.xcodeproj -scheme TapCourt -configuration Debug \
            -destination "id=$IPHONE" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$OUT/sim-build.log" 2>&1
          code=$?
          echo "sim build exit $code"
          [ $code -eq 0 ] || exit 0
          PRODUCTS="$RUNNER_TEMP/dd/Build/Products"
          B=com.lobster.smashly
          xcrun simctl boot $IPHONE || true
          xcrun simctl bootstatus $IPHONE -b > /dev/null
          xcrun simctl install $IPHONE "$PRODUCTS/Debug-iphonesimulator/TapCourt.app"
          xcrun simctl status_bar $IPHONE override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          if [ "$WATCH" != "none" ]; then
            xcrun simctl boot $WATCH || true
            xcrun simctl bootstatus $WATCH -b > /dev/null
            xcrun simctl install $WATCH "$PRODUCTS/Debug-watchsimulator/TapCourtWatch.app"
          fi
          mkdir -p "$OUT/shots"
          shot() {  # device file wait args...
            local dev=$1 file=$2 wait=$3; shift 3
            xcrun simctl terminate $dev $B 2>/dev/null || xcrun simctl terminate $dev $B.watchkitapp 2>/dev/null || true
            xcrun simctl launch $dev "$@" > /dev/null
            sleep $wait
            xcrun simctl io $dev screenshot "$OUT/shots/$file" > /dev/null 2>&1
          }
          for spec in en:en_US es:es_ES de:de_DE fr:fr_FR it:it_IT sv:sv_SE pt-BR:pt_BR ja:ja_JP ko:ko_KR zh-Hans:zh_CN; do
            L=${spec%%:*}; LOC=${spec##*:}
            LA=(-AppleLanguages "($L)" -AppleLocale $LOC)
            shot $IPHONE ${L}_1.png 6 $B "${LA[@]}" -demoPro -demoScore pb11
            shot $IPHONE ${L}_2.png 6 $B "${LA[@]}" -demoPro -demoScore pdStar
            shot $IPHONE ${L}_4.png 6 $B "${LA[@]}" -demoPro -demoHistory
            shot $IPHONE ${L}_5.png 7 $B "${LA[@]}" -demoPro -demoHistory -demoHistoryPage
            shot $IPHONE ${L}_paywall.png 6 $B "${LA[@]}" -demoPaywall
            if [ "$WATCH" != "none" ]; then
              xcrun simctl terminate $WATCH $B.watchkitapp 2>/dev/null || true
              xcrun simctl launch $WATCH $B.watchkitapp "${LA[@]}" -demoPro -demoScore pb11 > /dev/null
              sleep 7
              xcrun simctl io $WATCH screenshot "$OUT/shots/${L}_watch.png" > /dev/null 2>&1
            fi
          done
          ls "$OUT/shots" | wc -l | xargs echo "screenshots:"

      - name: Archive and upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: src
        env:
          KEY_B64: ${{ secrets.SLIME_ASC_KEY_B64 }}
          KEY_ID: ${{ secrets.SLIME_ASC_KEY_ID }}
          ISSUER: ${{ secrets.SLIME_ASC_ISSUER_ID }}
        run: |
          set +e
          test "$(cat $OUT/test.exit)" = "0" || { echo "tests failed, not uploading"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s' "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "build number $BUILD" | tee "$OUT/build-number.txt"
          xcodebuild archive -project TapCourt.xcodeproj -scheme TapCourt -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/TapCourt.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER= \
            > "$OUT/archive.log" 2>&1
          # Ad-hoc signature keeps the HealthKit entitlement in the watch app; export re-signs for distribution.
          codesign -d --entitlements - "$RUNNER_TEMP/TapCourt.xcarchive/Products/Applications/TapCourt.app/Watch/TapCourtWatch.app" 2>&1 | grep -c healthkit | xargs echo "watch healthkit entitlements:"
          code=$?
          echo "archive exit $code"
          if [ $code -eq 0 ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>VUPS57Y23P</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TapCourt.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > "$OUT/export.log" 2>&1
            code=$?
            echo "export/upload exit $code"
          fi
          rm -rf ~/private_keys
          echo "$code" > "$OUT/upload.exit"
          exit $code

      - name: Encrypt results
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/out.tar.gz" -C "$OUT" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/out.tar.gz" -out results.tar.gz.enc -pass env:PW

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapcourt-results
          path: results.tar.gz.enc
          retention-days: 3
          compression-level: 0

      - name: Fail if tests failed
        run: test "$(cat $OUT/test.exit)" = "0"
